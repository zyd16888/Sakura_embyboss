name: Publish Release Docker image

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  push_to_registries:
    name: Push docker image (GHCR + optional Docker Hub)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Compute image owner (lowercase for GHCR)
        run: echo "IMAGE_OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # secrets 上下文在步骤级 if 中不可用（Actions 限制），
      # 先探测写进 output，再弱校验：有则推 Docker Hub，无则跳过只推 GHCR
      - name: Detect Docker Hub secrets
        id: hub
        env:
          HUB_USER: ${{ secrets.DOCKER_USERNAME }}
          HUB_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$HUB_USER" ] && [ -n "$HUB_PASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 DOCKER_USERNAME/DOCKER_PASSWORD，本次仅推送 GHCR"
          fi

      - name: Login to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image tag list
        id: meta
        env:
          HUB_USER: ${{ secrets.DOCKER_USERNAME }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # workflow_dispatch 手动触发时没有 tag，回退为 latest
          [ -z "$TAG" ] && TAG=latest
          tags="ghcr.io/${IMAGE_OWNER}/sakura_embyboss:${TAG}"
          if [ "$TAG" != "latest" ]; then
            tags="${tags},ghcr.io/${IMAGE_OWNER}/sakura_embyboss:latest"
          fi
          if [ -n "$HUB_USER" ]; then
            tags="${tags},${HUB_USER}/sakura_embyboss:${TAG}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
