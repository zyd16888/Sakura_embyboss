name: Publish Latest Docker image

on:
  workflow_dispatch:
  push:
    branches: ['master']

jobs:
  push_to_registries:
    name: Push docker image (GHCR + optional Docker Hub)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Compute image owner (lowercase for GHCR)
        run: echo "IMAGE_OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 推送为可选项：仓库未配置 DOCKER_USERNAME/DOCKER_PASSWORD 时自动跳过
      - name: Login to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image tag list
        id: meta
        env:
          HUB_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          tags="ghcr.io/${IMAGE_OWNER}/sakura_embyboss:latest,ghcr.io/${IMAGE_OWNER}/sakura_embyboss:${GITHUB_SHA::7}"
          if [ -n "$HUB_USER" ]; then
            tags="${tags},${HUB_USER}/sakura_embyboss:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture images
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
